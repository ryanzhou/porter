# /var is a tmpfs; recreate what the packaged daemons expect to find.
d /var/lib/dhcpcd 0755 root root -
d /var/lib/misc   0755 root root -
d /var/lib/bluetooth 0700 root root -
d /var/log        0755 root root -

# An iPhone that has been told to trust the router is remembered across
# restarts: the pairing records are kept on the data partition. (Not in
# /data/porter, which only root may enter; usbmuxd does not run as root.)
# The directory itself is made by ensure-data: this file is acted on
# before the data partition is mounted.
L+ /var/lib/lockdown - - - - /data/lockdown
