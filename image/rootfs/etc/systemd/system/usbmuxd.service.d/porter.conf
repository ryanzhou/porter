# usbmuxd keeps the records of iPhones that trust the router on the data
# partition, and gives up for good if the place is not there when it
# starts. It is started by a phone being plugged in, which can be before
# the partition is ready, so it waits for that and is started again if it
# stops.
[Unit]
Wants=porter-data.service
After=porter-data.service

[Service]
Restart=on-failure
RestartSec=2
