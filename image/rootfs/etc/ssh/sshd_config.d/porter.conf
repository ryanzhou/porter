# SSH is off by default and reachable from the LAN only (see porterd's
# firewall). Keys live on the data partition and are managed by the app.
HostKey /data/porter/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /data/porter/ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
