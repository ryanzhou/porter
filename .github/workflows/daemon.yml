name: Daemon

on:
  push:
    paths: ["daemon/**", "image/packages", "image/mpquic.pin", "ios/PorterKit/Tests/PorterKitTests/Resources/**", ".github/workflows/daemon.yml"]
  workflow_dispatch:

concurrency:
  group: daemon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Vet and unit tests
        working-directory: daemon
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go vet -tags e2e ./e2e/
          go test -count=1 ./...
      - name: Tools for the end-to-end test
        run: |
          sudo apt-get update -q
          # wireless-regdb is for the kernel, which reads the regulatory
          # database from this machine whatever userland the tests run in.
          sudo apt-get install -y --no-install-recommends dnsmasq-base dhcpcd-base wireguard-tools nftables iproute2 \
            hostapd wpasupplicant iw rfkill wireless-regdb
          sudo modprobe wireguard
          # Simulated radios for the Wi-Fi test; it is skipped if the
          # runner's kernel does not ship the module.
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          # VLANs and PPPoE, for the tests of a tagged internet port, of
          # networks on one cable and of a PPPoE sign-in. They run inside
          # the image's userland, which has no modules of its own to load,
          # and count as failed there if they have to skip themselves: so
          # these must load.
          sudo modprobe -a 8021q ppp_generic pppox pppoe
          test -c /dev/ppp
          sudo systemctl stop hostapd wpa_supplicant 2>/dev/null || true
      - name: Kernel-level tests (firewall, policy routing) as root
        working-directory: daemon
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -count=1 -v ./internal/fw/
      - name: The same tests, and the end-to-end tests, inside the image's userland
        # Debian with exactly the image's packages, so that the versions of
        # nft, dnsmasq, dhcpcd, hostapd and wpa_supplicant are the router's
        # and nothing the image lacks is there to lean on.
        run: |
          sudo apt-get install -y --no-install-recommends mmdebstrap
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" daemon/e2e/in-image-userland.sh
