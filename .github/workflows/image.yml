name: Image

# Builds the SD card image. Runs on demand and for version tags, not on
# every push: it takes a while and the result is large. A version tag
# also publishes the image as a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends mmdebstrap qemu-user-static binfmt-support arch-test \
            dosfstools mtools fdisk e2fsprogs xz-utils gpg curl
      - name: Build image
        env:
          # Signs the release's update files. Without the secret they are
          # published unsigned, which a router accepts only if its image
          # was built without image/keys/update.pub.
          PORTER_UPDATE_KEY: ${{ secrets.PORTER_UPDATE_KEY }}
        run: |
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" "PORTER_UPDATE_KEY=$PORTER_UPDATE_KEY" image/build.sh "$PWD/build"
      - uses: actions/upload-artifact@v4
        with:
          name: porter-image
          path: |
            build/*.img.xz
            build/*.sha256
            build/*.gz
            build/update.json*
          compression-level: 0
          retention-days: 30
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          A router already running Porter updates itself: in the app, Settings, Software. Settings and pairings are kept.

          For a new card, flash \`porter-$TAG.img.xz\` with Raspberry Pi Imager; the README has the steps. Its SHA-256 is in \`porter-$TAG.img.xz.sha256\`. Build the app from the source at this tag.

          The other files (\`update.json\`, \`*-boot.vfat.gz\`, \`*-root.ext4.gz\`) are what routers download to update; there is no need to fetch them by hand.
          EOF
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/*.img.xz build/*.sha256 build/*.gz build/update.json* --clobber
          else
            gh release create "$TAG" build/*.img.xz build/*.sha256 build/*.gz build/update.json* --title "Porter $TAG" --notes-file notes.md --generate-notes --verify-tag
          fi
