name: Image

# Builds the SD card image. Runs on demand and for version tags, not on
# every push: it takes a while and the result is large. A version tag
# also publishes the image as a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends mmdebstrap qemu-user-static binfmt-support arch-test \
            dosfstools mtools fdisk e2fsprogs xz-utils gpg curl
      - name: Build image
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" image/build.sh "$PWD/build"
      - uses: actions/upload-artifact@v4
        with:
          name: porter-image
          path: |
            build/*.img.xz
            build/*.sha256
          compression-level: 0
          retention-days: 30
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Flash \`porter-$TAG.img.xz\` with Raspberry Pi Imager; the README has the steps.

          Flashing replaces the router's settings and pairings. In the app, forget the router, then pair and set it up again. Build the app from the source at this tag.

          SHA-256 of the image is in \`porter-$TAG.img.xz.sha256\`.
          EOF
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/*.img.xz build/*.sha256 --clobber
          else
            gh release create "$TAG" build/*.img.xz build/*.sha256 --title "Porter $TAG" --notes-file notes.md --generate-notes --verify-tag
          fi
