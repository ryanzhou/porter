name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: PorterKit tests
        working-directory: ios/PorterKit
        run: swift test
      - name: Build the app for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Porter.xcodeproj -scheme Porter \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          echo "Swift files compiled: $(grep -c 'SwiftCompile normal' xcodebuild.log || true)"
          test "${status:-0}" = 0
      - name: Check the built app contains the app's own code
        working-directory: ios
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Porter.app
          ls -l "$app"
          for symbol in DashboardView InternetView DevicesView VPNView SettingsView BLECentral; do
            grep -rqa "$symbol" "$app" || { echo "missing $symbol in the built app"; exit 1; }
          done
