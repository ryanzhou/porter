name: iOS

on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: PorterKit tests
        working-directory: ios/PorterKit
        run: swift test
      - name: Build the app for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Porter.xcodeproj -scheme Porter \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build \
            | grep -E "error|warning: unre|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          test "${PIPESTATUS[0]}" = 0
