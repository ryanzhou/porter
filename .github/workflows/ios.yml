name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: PorterKit tests
        working-directory: ios/PorterKit
        run: swift test
      - name: Build the app for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Porter.xcodeproj -scheme Porter \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          echo "Swift files compiled: $(grep -c 'SwiftCompile normal' xcodebuild.log || true)"
          test "${status:-0}" = 0
      - name: Check the built app contains the app's own code
        working-directory: ios
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Porter.app
          ls -l "$app"
          for symbol in DashboardView InternetView DevicesView VPNView SettingsView BLECentral; do
            grep -rqa "$symbol" "$app" || { echo "missing $symbol in the built app"; exit 1; }
          done
      - name: Screenshots of the app in demo mode
        working-directory: ios
        run: |
          set -euo pipefail
          app=build/Build/Products/Debug-iphonesimulator/Porter.app
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted((r for r in runtimes if "iOS" in r), reverse=True):
              phones = [d for d in runtimes[runtime] if d["name"].startswith("iPhone")]
              plain = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]] or phones
              if plain:
                  print(plain[-1]["udid"])
                  break
          ')
          test -n "$udid"
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$udid" "$app"
          mkdir -p screenshots
          for screen in overview internet devices vpn settings traffic flows speedtest device group adblock setup connect share software networks outside smoothing; do
            xcrun simctl launch "$udid" com.example.porter -demo -demoScreen "$screen"
            sleep 6
            xcrun simctl io "$udid" screenshot "screenshots/$screen.png"
            xcrun simctl terminate "$udid" com.example.porter || true
          done
          ls -l screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: porter-screenshots
          path: ios/screenshots/*.png
          retention-days: 30
